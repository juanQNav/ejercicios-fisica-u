<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Física Universitaria — Ejercicios Interactivos</title>
<style>
:root {
  --bg: #0f172a; --surface: #1e293b; --surface2: #334155;
  --text: #e2e8f0; --text2: #94a3b8; --accent: #38bdf8;
  --accent2: #818cf8; --success: #34d399; --warning: #fbbf24;
  --danger: #f87171; --radius: 12px;
}
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family: 'Segoe UI', system-ui, sans-serif; background: var(--bg); color: var(--text); line-height: 1.6; }
header { background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%); border-bottom: 1px solid var(--surface2); padding: 1.5rem 2rem; position: sticky; top: 0; z-index: 100; }
header h1 { font-size: 1.5rem; background: linear-gradient(90deg, var(--accent), var(--accent2)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
header p { color: var(--text2); font-size: 0.85rem; }
nav { display: flex; gap: 0.5rem; padding: 0.75rem 2rem; background: var(--surface); border-bottom: 1px solid var(--surface2); overflow-x: auto; flex-wrap: wrap; }
nav button { padding: 0.5rem 1rem; border: 1px solid var(--surface2); background: transparent; color: var(--text2); border-radius: 8px; cursor: pointer; font-size: 0.8rem; white-space: nowrap; transition: all 0.2s; }
nav button:hover { border-color: var(--accent); color: var(--accent); }
nav button.active { background: var(--accent); color: var(--bg); border-color: var(--accent); font-weight: 600; }
main { max-width: 900px; margin: 0 auto; padding: 1.5rem; }
.chapter-section { display: none; }
.chapter-section.active { display: block; }
.exercise-card { background: var(--surface); border: 1px solid var(--surface2); border-radius: var(--radius); margin-bottom: 1.5rem; overflow: hidden; }
.exercise-header { padding: 1rem 1.25rem; cursor: pointer; display: flex; justify-content: space-between; align-items: center; user-select: none; transition: background 0.2s; }
.exercise-header:hover { background: var(--surface2); }
.exercise-header h3 { font-size: 1rem; color: var(--accent); }
.exercise-header .toggle { font-size: 1.2rem; color: var(--text2); transition: transform 0.3s; }
.exercise-card.open .toggle { transform: rotate(180deg); }
.exercise-body { display: none; padding: 0 1.25rem 1.25rem; }
.exercise-card.open .exercise-body { display: block; }
.problem-statement { background: var(--surface2); border-left: 3px solid var(--accent2); padding: 1rem; border-radius: 0 8px 8px 0; margin-bottom: 1rem; font-size: 0.9rem; }
.diagram-container { background: #0f172a; border: 1px solid var(--surface2); border-radius: 8px; padding: 1rem; margin-bottom: 1rem; text-align: center; overflow-x: auto; }
.diagram-container svg { max-width: 100%; height: auto; }
.diagram-label { color: var(--text2); font-size: 0.75rem; margin-top: 0.5rem; }
.steps-container { margin: 1rem 0; }
.step { background: var(--bg); border: 1px solid var(--surface2); border-radius: 8px; margin-bottom: 0.5rem; overflow: hidden; }
.step-header { padding: 0.75rem 1rem; cursor: pointer; display: flex; justify-content: space-between; align-items: center; font-size: 0.85rem; color: var(--text2); }
.step-header:hover { color: var(--text); }
.step-header .step-num { background: var(--accent2); color: white; width: 24px; height: 24px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 0.7rem; font-weight: 700; margin-right: 0.5rem; flex-shrink: 0; }
.step-header .left { display: flex; align-items: center; }
.step-body { display: none; padding: 0.75rem 1rem; font-size: 0.85rem; border-top: 1px solid var(--surface2); }
.step.open .step-body { display: block; }
.math { font-family: 'Cambria Math', 'Latin Modern Math', Georgia, serif; color: var(--warning); background: rgba(251,191,36,0.08); padding: 0.15rem 0.4rem; border-radius: 4px; font-size: 0.9em; }
.formula-block { background: rgba(251,191,36,0.05); border: 1px solid rgba(251,191,36,0.15); border-radius: 8px; padding: 0.75rem 1rem; margin: 0.5rem 0; text-align: center; font-family: 'Cambria Math', Georgia, serif; color: var(--warning); font-size: 0.95rem; }
.tips-box { background: rgba(52,211,153,0.08); border: 1px solid rgba(52,211,153,0.2); border-radius: 8px; padding: 0.75rem 1rem; margin: 1rem 0; font-size: 0.8rem; }
.tips-box strong { color: var(--success); }
.figure-note { background: rgba(251,191,36,0.08); border: 1px solid rgba(251,191,36,0.25); border-left: 3px solid var(--warning); border-radius: 0 8px 8px 0; padding: 0.75rem 1rem; margin: 1rem 0; font-size: 0.8rem; }
.figure-note strong { color: var(--warning); }
.videos-section { margin: 1rem 0; }
.videos-section h4 { color: var(--accent); margin-bottom: 0.5rem; font-size: 0.9rem; }
.video-link { display: flex; align-items: center; gap: 0.5rem; padding: 0.5rem 0.75rem; background: var(--surface2); border-radius: 6px; margin-bottom: 0.4rem; text-decoration: none; color: var(--text); font-size: 0.8rem; transition: all 0.2s; }
.video-link:hover { background: var(--accent); color: var(--bg); }
.video-link svg { flex-shrink: 0; width: 20px; height: 20px; fill: currentColor; }
.answer-section { margin-top: 1rem; }
.btn { padding: 0.6rem 1.25rem; border: none; border-radius: 8px; cursor: pointer; font-size: 0.85rem; font-weight: 600; transition: all 0.2s; }
.btn-primary { background: var(--accent); color: var(--bg); }
.btn-primary:hover { background: #7dd3fc; }
.btn-success { background: var(--success); color: var(--bg); }
.btn-success:hover { background: #6ee7b7; }
.btn-outline { background: transparent; border: 1px solid var(--surface2); color: var(--text2); }
.btn-outline:hover { border-color: var(--accent); color: var(--accent); }
.answer-reveal { display: none; background: rgba(52,211,153,0.1); border: 1px solid rgba(52,211,153,0.3); border-radius: 8px; padding: 1rem; margin-top: 0.75rem; }
.answer-reveal.visible { display: block; }
.answer-reveal h4 { color: var(--success); margin-bottom: 0.5rem; }
.progress-bar { position: fixed; top: 0; left: 0; height: 3px; background: linear-gradient(90deg, var(--accent), var(--accent2)); z-index: 200; transition: width 0.3s; }
.stats { display: flex; gap: 1rem; padding: 0.75rem 2rem; background: var(--bg); border-bottom: 1px solid var(--surface2); font-size: 0.75rem; color: var(--text2); }
.stats span { display: flex; align-items: center; gap: 0.25rem; }
.stats .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
.stats .dot.solved { background: var(--success); }
.stats .dot.pending { background: var(--warning); }
/* ====== FORMULARIO ====== */
.formula-ref-section { display: none; }
.formula-ref-section.active { display: block; }
.formula-toolbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; flex-wrap: wrap; gap: 0.5rem; }
.formula-toolbar h2 { font-size: 1.2rem; color: var(--accent); }
.btn-print { background: var(--accent2); color: white; }
.btn-print:hover { background: #a5b4fc; }
.formula-topic { background: var(--surface); border: 1px solid var(--surface2); border-radius: var(--radius); margin-bottom: 1.25rem; overflow: hidden; }
.formula-topic-header { padding: 0.85rem 1.25rem; cursor: pointer; display: flex; justify-content: space-between; align-items: center; background: var(--surface2); transition: background 0.2s; user-select: none; }
.formula-topic-header:hover { background: #3d4f68; }
.formula-topic-header h3 { font-size: 0.95rem; color: var(--accent2); }
.formula-topic-header .toggle { color: var(--text2); transition: transform 0.3s; }
.formula-topic.open .formula-topic-header .toggle { transform: rotate(180deg); }
.formula-topic-body { display: none; padding: 1rem 1.25rem; }
.formula-topic.open .formula-topic-body { display: block; }
.formula-card { background: var(--bg); border: 1px solid var(--surface2); border-radius: 8px; margin-bottom: 0.75rem; overflow: hidden; }
.formula-card-header { padding: 0.6rem 1rem; cursor: pointer; display: flex; justify-content: space-between; align-items: center; font-size: 0.85rem; color: var(--warning); font-weight: 600; transition: color 0.2s; }
.formula-card-header:hover { color: #fcd34d; }
.formula-card-header .toggle { font-size: 0.9rem; color: var(--text2); transition: transform 0.3s; }
.formula-card.open .formula-card-header .toggle { transform: rotate(180deg); }
.formula-card-body { display: none; padding: 0.75rem 1rem; border-top: 1px solid var(--surface2); }
.formula-card.open .formula-card-body { display: block; }
.formula-main { text-align: center; padding: 0.5rem; background: rgba(251,191,36,0.08); border-radius: 6px; margin-bottom: 0.75rem; font-family: 'Cambria Math', Georgia, serif; color: var(--warning); font-size: 1.05rem; }
.despejes-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 0.4rem; margin-bottom: 0.75rem; }
.despeje-item { background: var(--surface2); border-radius: 6px; padding: 0.4rem 0.6rem; font-family: 'Cambria Math', Georgia, serif; font-size: 0.85rem; color: var(--text); text-align: center; }
.despeje-item .label { color: var(--accent); font-size: 0.75rem; font-family: 'Segoe UI', system-ui, sans-serif; display: block; margin-bottom: 0.15rem; }
.when-to-use { background: rgba(52,211,153,0.08); border: 1px solid rgba(52,211,153,0.2); border-radius: 6px; padding: 0.6rem 0.75rem; font-size: 0.8rem; }
.when-to-use strong { color: var(--success); }
/* ====== PRINT ====== */
@media print {
  header, nav, .stats, .progress-bar, .btn, .formula-toolbar, .exercise-card, .chapter-section, .flashcard-section, .mnemo-section { display: none !important; }
  .formula-ref-section { display: block !important; }
  body { background: white !important; color: black !important; font-size: 10pt; }
  .formula-topic { display: block !important; page-break-inside: avoid; border: 1px solid #ccc; margin-bottom: 0.75rem; }
  .formula-topic-header { background: #f0f0f0 !important; color: #333 !important; }
  .formula-topic-header h3 { color: #1a1a8a !important; }
  .formula-topic-body { display: block !important; padding: 0.5rem; }
  .formula-card { display: block !important; border: 1px solid #ddd; page-break-inside: avoid; }
  .formula-card-body { display: block !important; }
  .formula-main { color: #b8860b !important; background: #fff8dc !important; border: 1px solid #e0c060; }
  .despeje-item { background: #f5f5f5 !important; color: #333 !important; border: 1px solid #ddd; }
  .despeje-item .label { color: #2563eb !important; }
  .when-to-use { background: #f0fdf4 !important; border-color: #86efac !important; color: #333 !important; }
  .when-to-use strong { color: #16a34a !important; }
  .print-header { display: block !important; text-align: center; margin-bottom: 1rem; border-bottom: 2px solid #333; padding-bottom: 0.5rem; }
  .print-header h1 { font-size: 16pt; color: #1a1a8a; margin: 0; }
  .print-header p { font-size: 9pt; color: #666; margin: 0.25rem 0 0; }
}
.print-header { display: none; }
/* ====== MNEMOTECNIAS ====== */
.mnemo-section { display: none; }
.mnemo-section.active { display: block; }
.mnemo-toolbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.25rem; flex-wrap: wrap; gap: 0.5rem; }
.mnemo-toolbar h2 { font-size: 1.2rem; color: var(--accent); }
.mnemo-group-tabs { display: flex; gap: 0.4rem; margin-bottom: 1.25rem; flex-wrap: wrap; }
.mnemo-group-tab { padding: 0.4rem 0.8rem; border: 1px solid var(--surface2); background: transparent; color: var(--text2); border-radius: 8px; cursor: pointer; font-size: 0.75rem; transition: all 0.2s; }
.mnemo-group-tab:hover { border-color: var(--warning); color: var(--warning); }
.mnemo-group-tab.active { background: var(--warning); color: var(--bg); border-color: var(--warning); font-weight: 600; }
.mnemo-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 1rem; }
.mnemo-card { background: var(--surface); border: 1px solid var(--surface2); border-radius: var(--radius); overflow: hidden; transition: transform 0.2s, box-shadow 0.2s; }
.mnemo-card:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(0,0,0,0.3); }
.mnemo-card-header { padding: 1rem 1.25rem; cursor: pointer; display: flex; justify-content: space-between; align-items: flex-start; gap: 0.75rem; user-select: none; }
.mnemo-card-header .mnemo-emoji { font-size: 1.5rem; flex-shrink: 0; }
.mnemo-card-header .mnemo-info { flex: 1; }
.mnemo-card-header .mnemo-name { font-size: 0.9rem; color: var(--accent); font-weight: 600; margin-bottom: 0.25rem; }
.mnemo-card-header .mnemo-formula-mini { font-family: 'Cambria Math', Georgia, serif; font-size: 0.85rem; color: var(--warning); background: rgba(251,191,36,0.08); padding: 0.2rem 0.5rem; border-radius: 4px; display: inline-block; }
.mnemo-card-header .mnemo-toggle { font-size: 1.2rem; color: var(--text2); transition: transform 0.3s; flex-shrink: 0; margin-top: 0.25rem; }
.mnemo-card.open .mnemo-card-header .mnemo-toggle { transform: rotate(180deg); }
.mnemo-card-body { display: none; padding: 0 1.25rem 1.25rem; }
.mnemo-card.open .mnemo-card-body { display: block; }
.mnemo-text { background: rgba(251,191,36,0.06); border: 1px solid rgba(251,191,36,0.15); border-radius: 8px; padding: 0.75rem 1rem; font-size: 0.85rem; color: var(--text); line-height: 1.5; }
.mnemo-text .highlight { color: var(--warning); font-weight: 600; }
.mnemo-text .formula-ref { font-family: 'Cambria Math', Georgia, serif; color: var(--accent2); font-size: 0.8rem; display: block; margin-top: 0.5rem; opacity: 0.7; }
.mnemo-card .mnemo-tag { display: inline-block; font-size: 0.65rem; padding: 0.15rem 0.5rem; border-radius: 4px; margin-top: 0.5rem; font-weight: 600; }
.mnemo-tag.trick { background: rgba(129,140,248,0.15); color: var(--accent2); }
@media (max-width: 768px) {
  .mnemo-grid { grid-template-columns: 1fr; }
  .mnemo-card-header { padding: 0.75rem 1rem; min-height: 44px; }
  .mnemo-card-body { padding: 0 0.75rem 1rem; }
  .mnemo-text { font-size: 0.8rem; padding: 0.6rem 0.75rem; }
  .mnemo-group-tab { min-height: 44px; }
}
@media (max-width: 420px) {
  .mnemo-toolbar { flex-direction: column; align-items: flex-start; }
  .mnemo-toolbar h2 { font-size: 1rem; }
  .mnemo-card-header .mnemo-formula-mini { font-size: 0.75rem; }
}
@media print {
  .mnemo-section { display: none !important; }
}
/* ====== FLASHCARDS ====== */
.flashcard-section { display: none; }
.flashcard-section.active { display: block; }
.flashcard-toolbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.25rem; flex-wrap: wrap; gap: 0.5rem; }
.flashcard-toolbar h2 { font-size: 1.2rem; color: var(--accent); }
.fc-group-tabs { display: flex; gap: 0.4rem; margin-bottom: 1rem; flex-wrap: wrap; }
.fc-group-tab { padding: 0.4rem 0.8rem; border: 1px solid var(--surface2); background: transparent; color: var(--text2); border-radius: 8px; cursor: pointer; font-size: 0.75rem; transition: all 0.2s; }
.fc-group-tab:hover { border-color: var(--accent2); color: var(--accent2); }
.fc-group-tab.active { background: var(--accent2); color: white; border-color: var(--accent2); }
.fc-progress { display: flex; align-items: center; gap: 0.5rem; font-size: 0.8rem; color: var(--text2); margin-bottom: 0.75rem; }
.fc-progress-bar { flex: 1; height: 6px; background: var(--surface2); border-radius: 3px; overflow: hidden; }
.fc-progress-fill { height: 100%; background: linear-gradient(90deg, var(--success), var(--accent)); transition: width 0.3s; border-radius: 3px; }
.fc-container { perspective: 1200px; min-height: 280px; margin-bottom: 1rem; }
.fc-card { position: relative; width: 100%; min-height: 260px; cursor: pointer; transition: transform 0.6s; transform-style: preserve-3d; }
.fc-card.flipped { transform: rotateY(180deg); }
.fc-face { position: absolute; inset: 0; backface-visibility: hidden; border-radius: var(--radius); padding: 1.5rem; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; }
.fc-front { background: var(--surface); border: 2px solid var(--surface2); }
.fc-front .fc-label { font-size: 0.75rem; color: var(--accent2); text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 0.5rem; }
.fc-front .fc-topic { font-size: 0.85rem; color: var(--text2); margin-bottom: 0.75rem; }
.fc-front .fc-name { font-size: 1.15rem; color: var(--warning); font-weight: 700; margin-bottom: 1rem; line-height: 1.4; }
.fc-front .fc-hint { font-size: 0.8rem; color: var(--text2); font-style: italic; }
.fc-back { background: var(--surface); border: 2px solid var(--success); transform: rotateY(180deg); }
.fc-back .fc-formula { font-family: 'Cambria Math', Georgia, serif; font-size: 1.2rem; color: var(--warning); background: rgba(251,191,36,0.08); padding: 0.75rem 1.25rem; border-radius: 8px; margin-bottom: 1rem; line-height: 1.6; }
.fc-back .fc-despejes { font-size: 0.8rem; color: var(--text2); margin-bottom: 0.75rem; }
.fc-back .fc-despejes strong { color: var(--accent); }
.fc-back .fc-when { font-size: 0.8rem; color: var(--success); background: rgba(52,211,153,0.08); padding: 0.5rem 0.75rem; border-radius: 6px; }
.fc-back .fc-when strong { color: var(--success); }
.fc-nav { display: flex; justify-content: center; align-items: center; gap: 1rem; margin-bottom: 1rem; }
.fc-nav button { padding: 0.5rem 1rem; border: 1px solid var(--surface2); background: var(--surface); color: var(--text); border-radius: 8px; cursor: pointer; font-size: 0.85rem; transition: all 0.2s; }
.fc-nav button:hover { border-color: var(--accent); color: var(--accent); }
.fc-nav button:disabled { opacity: 0.3; cursor: default; }
.fc-nav .fc-counter { font-size: 0.85rem; color: var(--text2); min-width: 60px; text-align: center; }
.fc-actions { display: flex; justify-content: center; gap: 0.5rem; }
.fc-btn-mastered { background: var(--success); color: var(--bg); border: none; padding: 0.5rem 1.25rem; border-radius: 8px; cursor: pointer; font-size: 0.8rem; font-weight: 600; transition: all 0.2s; }
.fc-btn-mastered:hover { background: #6ee7b7; }
.fc-btn-mastered.is-mastered { background: var(--surface2); color: var(--text2); cursor: default; }
.fc-btn-shuffle { background: transparent; border: 1px solid var(--surface2); color: var(--text2); padding: 0.5rem 1rem; border-radius: 8px; cursor: pointer; font-size: 0.8rem; transition: all 0.2s; }
.fc-btn-shuffle:hover { border-color: var(--accent2); color: var(--accent2); }
@media (max-width: 768px) {
  .fc-face { padding: 1rem; }
  .fc-front .fc-name { font-size: 1rem; }
  .fc-back .fc-formula { font-size: 1rem; padding: 0.5rem 0.75rem; }
  .fc-container { min-height: 240px; }
  .fc-card { min-height: 230px; }
  .fc-group-tabs { gap: 0.3rem; }
  .fc-group-tab { padding: 0.35rem 0.6rem; font-size: 0.7rem; min-height: 44px; }
  .fc-btn-mastered, .fc-btn-shuffle { min-height: 44px; }
  .fc-nav button { min-height: 44px; }
}
@media (max-width: 420px) {
  .fc-front .fc-name { font-size: 0.9rem; }
  .fc-back .fc-formula { font-size: 0.9rem; }
  .fc-nav { gap: 0.5rem; }
  .fc-toolbar { flex-direction: column; align-items: flex-start; }
  .fc-toolbar h2 { font-size: 1rem; }
}
/* ====== RESPONSIVE ====== */
@media (max-width: 768px) {
  header { padding: 0.75rem 1rem; }
  header h1 { font-size: 1.1rem; }
  header p { font-size: 0.75rem; }
  nav { padding: 0.5rem 0.75rem; gap: 0.35rem; }
  nav button { padding: 0.45rem 0.8rem; font-size: 0.75rem; min-height: 44px; }
  .stats { padding: 0.5rem 0.75rem; font-size: 0.7rem; flex-wrap: wrap; }
  main { padding: 0.75rem; }
  .exercise-header { padding: 0.75rem 1rem; }
  .exercise-header h3 { font-size: 0.85rem; }
  .exercise-body { padding: 0 0.75rem 1rem; }
  .problem-statement { padding: 0.75rem; font-size: 0.8rem; }
  .diagram-container { padding: 0.5rem; }
  .step-header { padding: 0.6rem 0.75rem; font-size: 0.8rem; min-height: 44px; }
  .step-body { padding: 0.6rem 0.75rem; font-size: 0.8rem; }
  .formula-block { padding: 0.5rem 0.75rem; font-size: 0.85rem; word-break: break-word; }
  .tips-box { padding: 0.6rem 0.75rem; font-size: 0.75rem; }
  .btn { padding: 0.65rem 1rem; font-size: 0.8rem; min-height: 44px; display: inline-flex; align-items: center; justify-content: center; }
  .answer-section { display: flex; flex-direction: column; gap: 0.5rem; }
  .answer-reveal { padding: 0.75rem; }
  .answer-reveal pre { font-size: 0.8rem; }
}
@media (max-width: 420px) {
  header h1 { font-size: 1rem; }
  nav { padding: 0.4rem 0.5rem; }
  nav button { padding: 0.4rem 0.6rem; font-size: 0.7rem; }
  .exercise-header h3 { font-size: 0.8rem; }
  .problem-statement { font-size: 0.75rem; }
  .step-header { font-size: 0.75rem; }
  .step-body { font-size: 0.75rem; }
  .formula-block { font-size: 0.8rem; }
  .formula-toolbar { flex-direction: column; align-items: flex-start; }
  .formula-toolbar h2 { font-size: 1rem; }
  .despejes-grid { grid-template-columns: 1fr; }
  .formula-topic-header { padding: 0.6rem 0.75rem; min-height: 44px; }
  .formula-topic-body { padding: 0.75rem; }
  .formula-card-header { padding: 0.5rem 0.75rem; font-size: 0.8rem; min-height: 44px; }
  .formula-card-body { padding: 0.5rem 0.75rem; }
  .formula-main { font-size: 0.9rem; padding: 0.4rem; }
}
</style>
</head>
<body>
<div class="progress-bar" id="progressBar" style="width:0%"></div>

      main: "y = x·tan α₀ − (g · x²) / (2·v₀²·cos²α₀)",
      despejes: [],
      when: "Describe la forma parabolica y(x) eliminando el tiempo. Permite hallar y para cualquier x sin calcular t."
    },
    {
      name: "Magnitud y direccion de la velocidad [Ec. 3.25, 3.26]",
      main: "v = √(vx² + vy²) &nbsp;&nbsp; tan α = vy / vx",
      despejes: [
        { label: "Componente x", eq: "vx = √(v² − vy²)" },
        { label: "Componente y", eq: "vy = √(v² − vx²)" }
      ],
      when: "La velocidad instantanea es tangente a la trayectoria. α es el angulo de la velocidad respecto a la horizontal."
    },
    {
      name: "Alcance horizontal maximo [terreno nivelado]",
      main: "R = v₀² · sin(2α₀) / g",
      despejes: [
        { label: "Rapidez inicial", eq: "v₀ = √(R·g / sin(2α₀))" },
        { label: "Alcance maximo absoluto", eq: "α₀ = 45° → R_max = v₀²/g" }
      ],
      when: "Solo cuando el proyectil sale y cae a la MISMA altura (y = y₀). No aplica si hay diferencia de alturas."
    }
  ]
},
  {
    topic: "Movimiento circular (Capitulo 3.4)",
  formulas: [
    {
      name: "Aceleracion radial (centripeta) [Ec. 3.28]",
      main: "a<sub>rad</sub> = v² / R",
      despejes: [
        { label: "Rapidez", eq: "v = √(a_rad · R)" },
        { label: "Radio", eq: "R = v² / a_rad" }
      ],
      when: "Cualquier objeto en trayectoria circular. Siempre apunta al centro. En MCU es la UNICA aceleracion."
    },
    {
      name: "Periodo y rapidez lineal [Ec. 3.29]",
      main: "v = 2πR / T &nbsp;&nbsp; T = 2πR / v",
      despejes: [
        { label: "Rapidez angular", eq: "ω = 2π / T = v / R" },
        { label: "Radio", eq: "R = vT / (2π)" }
      ],
      when: "T es el tiempo de una vuelta completa. Relaciona rapidez lineal con el periodo."
    },
    {
      name: "Aceleracion radial con periodo [Ec. 3.30]",
      main: "a<sub>rad</sub> = 4π²R / T²",
      despejes: [
        { label: "Periodo", eq: "T = 2π√(R / a_rad)" },
        { label: "Radio", eq: "R = a_rad·T² / (4π²)" }
      ],
      when: "Forma alternativa de a_rad cuando conoces el periodo en vez de la rapidez lineal."
    },
    {
      name: "Aceleracion tangencial [Ec. 3.31]",
      main: "a<sub>tan</sub> = d|v|/dt",
      despejes: [
        { label: "Si a_tan constante", eq: "Δ|v| = a_tan · Δt" }
      ],
      when: "Solo en MCU no uniforme. Es paralela a la velocidad (tangente a la trayectoria). Si la rapidez es constante, a_tan = 0."
    },
      {
        name: "Aceleracion total [MCU no uniforme]",
        main: "a = √(a<sub>rad</sub>² + a<sub>tan</sub>²)",
      despejes: [
        { label: "Vector total", eq: "a = a_rad + a_tan" }
      ],
        when: "Cuando hay ambas componentes. La direccion NO apunta exactamente al centro."
      }
    ]
  },
  {
    topic: "Trabajo, energía cinética y potencia (Capítulo 6)",
    formulas: [
      {
        name: "Energía cinética [Ec. 6.6]",
        main: "K = ½ m v²",
        despejes: [
          { label: "Rapidez", eq: "v = √(2K / m)" },
          { label: "Masa", eq: "m = 2K / v²" }
        ],
        when: "Energía asociada al movimiento. Depende del cuadrado de la rapidez; no depende de la dirección."
      },
      {
        name: "Trabajo de una fuerza constante [Ec. 6.3]",
        main: "W = F d cos φ",
        despejes: [
          { label: "Fuerza paralela", eq: "φ = 0° → W = Fd" },
          { label: "Fuerza perpendicular", eq: "φ = 90° → W = 0" }
        ],
        when: "φ es el ángulo entre la fuerza y el desplazamiento. El trabajo es negativo si la fuerza apunta en sentido opuesto al movimiento."
      },
      {
        name: "Teorema trabajo-energía [Ec. 6.7]",
        main: "W<sub>net</sub> = ΔK = K<sub>f</sub> − K<sub>i</sub>",
        despejes: [
          { label: "Rapidez final", eq: "v_f = √(v_i² + 2W_net/m)" },
          { label: "Energía final", eq: "K_f = K_i + W_net" }
        ],
        when: "El trabajo neto de todas las fuerzas cambia la energía cinética. Es útil cuando se conoce el desplazamiento pero no el tiempo."
      },
      {
        name: "Trabajo de la gravedad",
        main: "W<sub>g</sub> = −mg(y<sub>f</sub> − y<sub>i</sub>)",
        despejes: [
          { label: "Descenso vertical h", eq: "W_g = +mgh" },
          { label: "Ascenso vertical h", eq: "W_g = −mgh" }
        ],
        when: "La gravedad hace trabajo positivo durante un descenso y negativo durante un ascenso. Solo importa el cambio vertical."
      },
      {
        name: "Trabajo de fricción cinética",
        main: "W<sub>f</sub> = −f<sub>k</sub>d = −μ<sub>k</sub> n d",
        despejes: [
          { label: "Plano horizontal", eq: "n = mg → W_f = −μ_k mgd" },
          { label: "Pendiente θ", eq: "n = mg cos θ" }
        ],
        when: "Para fricción cinética constante opuesta al desplazamiento. En superficies inclinadas usa la normal correspondiente, no mg directamente."
      },
      {
        name: "Potencia media e instantánea [Ec. 6.16, 6.18]",
        main: "P<sub>med</sub> = W / Δt &nbsp;&nbsp; P = F · v",
        despejes: [
          { label: "Fuerza y rapidez paralelas", eq: "P = Fv" },
          { label: "Ascenso vertical", eq: "P = mgv_y" },
          { label: "Energía transferida", eq: "W = P_med Δt" }
        ],
        when: "La potencia es la tasa de transferencia de energía. Usa la componente de la velocidad paralela a la fuerza."
      }
    ]
  },
  {
    topic: "Energía potencial y conservación (Capítulo 7)",
    formulas: [
      {
        name: "Energía potencial gravitatoria [Ec. 7.2]",
        main: "U<sub>g</sub> = m g y",
        despejes: [
          { label: "Cambio de energía", eq: "ΔU_g = mg(y_f − y_i)" },
          { label: "Cambio de altura", eq: "Δy = ΔU_g/(mg)" }
        ],
        when: "Elige un nivel de referencia para y. Solo las diferencias de energía potencial tienen significado físico."
      },
      {
        name: "Energía potencial elástica [Ec. 7.6]",
        main: "U<sub>el</sub> = ½ k x²",
        despejes: [
          { label: "Deformación", eq: "x = √(2U_el / k)" },
          { label: "Constante del resorte", eq: "k = 2U_el / x²" }
        ],
        when: "x es la extensión o compresión respecto a la longitud natural. La energía es no negativa y crece con x²."
      },
      {
        name: "Conservación de energía con trabajo no conservativo [Ec. 7.7]",
        main: "K<sub>i</sub> + U<sub>i</sub> + W<sub>nc</sub> = K<sub>f</sub> + U<sub>f</sub>",
        despejes: [
          { label: "Trabajo no conservativo", eq: "W_nc = Δ(K + U)" },
          { label: "Sin fuerzas no conservativas", eq: "K_i + U_i = K_f + U_f" }
        ],
        when: "Incluye explícitamente el trabajo de fricción u otras fuerzas no conservativas. Si no hacen trabajo, la energía mecánica se conserva."
      },
      {
        name: "Fuerza restauradora de un resorte [Ec. 7.8]",
        main: "F<sub>x</sub> = −kx",
        despejes: [
          { label: "Magnitud", eq: "|F| = k|x|" },
          { label: "Dos resortes en paralelo", eq: "k_eff = k_1 + k_2" }
        ],
        when: "La fuerza apunta hacia la posición de equilibrio. La rapidez en una oscilación sin fricción es máxima al pasar por el equilibrio."
      },
      {
        name: "Contacto mínimo en la cima de un rizo",
        main: "n = 0 → v²/R = g → v<sub>mín</sub> = √(gR)",
        despejes: [
          { label: "Rapidez crítica", eq: "v² = gR" },
          { label: "Altura inicial mínima", eq: "mgh = mg(2R) + ½m(gR) → h = 5R/2" }
        ],
        when: "En el límite de perder contacto en la parte superior, la normal es cero y la gravedad aporta toda la aceleración centrípeta."
      }
    ]
  }
];

const solvedKey = 'fisica_univ_solved';
let solved = JSON.parse(localStorage.getItem(solvedKey) || '[]');

function markSolved(id) {
  if (!solved.includes(id)) { solved.push(id); localStorage.setItem(solvedKey, JSON.stringify(solved)); }
}

// ====== RENDER ======
function renderNav() {
  const nav = document.getElementById('chapterNav');
  const chapters = Object.keys(exercises);
  nav.innerHTML = chapters.map((ch, i) => `<button class="${i===0?'active':''}" data-chapter="${ch}">${ch}</button>`).join('')
    + `<button data-chapter="mnemos" style="border-color: var(--warning); color: var(--warning);">🧠 Mnemotecnias</button>`
    + `<button data-chapter="flashcards" style="border-color: var(--accent); color: var(--accent);">⚡ Flashcards</button>`
    + `<button data-chapter="form" style="margin-left:auto; border-color: var(--accent2); color: var(--accent2);">📐 Formulario</button>`;
  nav.querySelectorAll('button').forEach(btn => {
    btn.addEventListener('click', () => {
      nav.querySelectorAll('button').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      document.querySelectorAll('.chapter-section').forEach(s => s.classList.remove('active'));
      const formSection = document.getElementById('formulaRef');
      const flashSection = document.getElementById('flashcardSection');
      const mnemoSection = document.getElementById('mnemoSection');
      if (formSection) formSection.classList.remove('active');
      if (flashSection) flashSection.classList.remove('active');
      if (mnemoSection) mnemoSection.classList.remove('active');
      if (btn.dataset.chapter === 'form') {
        if (formSection) formSection.classList.add('active');
      } else if (btn.dataset.chapter === 'flashcards') {
        if (flashSection) flashSection.classList.add('active');
        initFlashcards();
      } else if (btn.dataset.chapter === 'mnemos') {
        if (mnemoSection) mnemoSection.classList.add('active');
        renderMnemos();
      } else {
        document.getElementById('ch-' + btn.dataset.chapter.replace(/ /g,'_')).classList.add('active');
      }
      updateProgress();
    });
  });
}

function renderStats() {
  const total = Object.values(exercises).flat().length;
  const done = solved.length;
  document.getElementById('statsBar').innerHTML = `<span><span class="dot solved"></span> Resueltos: ${done}/${total}</span><span><span class="dot pending"></span> Pendientes: ${total - done}</span><span>Progreso: ${Math.round(done/total*100)}%</span>`;
}

function updateProgress() {
  const total = Object.values(exercises).flat().length;
  document.getElementById('progressBar').style.width = (solved.length / total * 100) + '%';
  renderStats();
}

        <div class="answer-reveal" id="ans-${ex.id.replace('.','_')}">
          <h4>Respuesta correcta:</h4>
          <pre style="white-space:pre-wrap; color: var(--text); font-size:0.85rem;">${ex.answer}</pre>
          <div style="margin-top:0.5rem; display:flex; gap:0.5rem; flex-wrap:wrap;">
            <button class="btn btn-success" onclick="markSolvedAndClose('${ex.id}', this)">✓ Lo resolvi correcto</button>
            <button class="btn btn-outline" onclick="hideAnswer('${ex.id.replace('.','_')}')">Ocultar</button>
          </div>
        </div>
      </div>
    </div>
  </div>`;
}

function renderAll() {
  const main = document.getElementById('mainContent');
  const chapters = Object.keys(exercises);
  main.innerHTML = chapters.map(ch => `<div class="chapter-section ${ch===chapters[0]?'active':''}" id="ch-${ch.replace(/ /g,'_')}">
    ${exercises[ch].map((ex, i) => renderExercise(ex, i)).join('')}
  </div>`).join('') + `<div class="mnemo-section" id="mnemoSection"></div>` + `<div class="flashcard-section" id="flashcardSection"></div>` + `<div class="formula-ref-section" id="formulaRef"></div>`;
  renderMnemos();
  renderFlashcards();
  renderFormulaRef();
  updateProgress();
}

// ====== FORMULARIO RENDER ======

    <h2>Formulario de Fisica</h2>
    <button class="btn btn-print" onclick="printFormulario()">📄 Descargar / Imprimir PDF</button>
  </div>
  <div class="print-header">
    <h1>Formulario de Fisica Universitaria</h1>
    <p>Sears & Zemansky, 12a ed. — Referencia rapida con despejes y casos de uso</p>
  </div>`;

  formulaRef.forEach((topic, ti) => {
    html += `<div class="formula-topic" id="ft-${ti}">
      <div class="formula-topic-header" onclick="toggleFormulaTopic(${ti})">
        <h3>${topic.topic}</h3>
        <span class="toggle">▼</span>
      </div>
      <div class="formula-topic-body">`;

    topic.formulas.forEach((f, fi) => {
      const despejesHtml = f.despejes.length > 0

            `<div class="despeje-item"><span class="label">${d.label}</span>${d.eq}</div>`
          ).join('')}</div>`
        : '';

      html += `<div class="formula-card" id="fc-${ti}-${fi}">
        <div class="formula-card-header" onclick="toggleFormulaCard(${ti}, ${fi})">
          <span>${f.name}</span>
          <span class="toggle">▼</span>
        </div>
        <div class="formula-card-body">
          <div class="formula-main">${f.main}</div>
          ${despejesHtml}
          <div class="when-to-use"><strong>¿Cuando usarla?</strong> ${f.when}</div>
        </div>
      </div>`;
    });

    html += `</div></div>`;
  });

  document.getElementById('formulaRef').innerHTML = html;
}

window.toggleFormulaTopic = function(ti) {
  document.getElementById('ft-' + ti).classList.toggle('open');
};

window.toggleFormulaCard = function(ti, fi) {
  document.getElementById('fc-' + ti + '-' + fi).classList.toggle('open');
};

window.printFormulario = function() {
  // Abre todos los topics y cards antes de imprimir
  document.querySelectorAll('.formula-topic').forEach(el => el.classList.add('open'));
  document.querySelectorAll('.formula-card').forEach(el => el.classList.add('open'));

};

// ====== INTERACTIONS ======
window.revealAnswer = function(id, btn) {
  const ans = document.getElementById('ans-' + id);
  ans.classList.add('visible');
  btn.style.display = 'none';
};

window.hideAnswer = function(id) {
  const ans = document.getElementById('ans-' + id);
  ans.classList.remove('visible');
  // Restore the "Mostrar respuesta" button
  const showBtn = ans.parentElement.querySelector('.btn-primary');
  if (showBtn) showBtn.style.display = '';
};

window.markSolvedAndClose = function(id, btn) {
  markSolved(id);
  const card = document.getElementById('ex-' + id);
  if (card) card.querySelector('.toggle').textContent = '✓';
  updateProgress();
  btn.textContent = '✓ Marcado como resuelto';
  btn.disabled = true;
};

// ====== FLASHCARD ENGINE ======
const fcMasteredKey = 'fisica_fc_mastered';
let fcMastered = JSON.parse(localStorage.getItem(fcMasteredKey) || '{}');
let fcState = { groupIdx: 0, cardIdx: 0, flipped: false, order: [] };

function markFcMastered(groupIdx, cardIdx) {
  const key = flashcardData[groupIdx].group + '-' + cardIdx;
  fcMastered[key] = true;
  localStorage.setItem(fcMasteredKey, JSON.stringify(fcMastered));
}

function isFcMastered(groupIdx, cardIdx) {
  return !!fcMastered[flashcardData[groupIdx].group + '-' + cardIdx];
}

function fcGroupMasteredCount(groupIdx) {
  const cards = flashcardData[groupIdx].cards;
  let count = 0;
  for (let i = 0; i < cards.length; i++) { if (isFcMastered(groupIdx, i)) count++; }
  return count;
}

function shuffleArray(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}

function initFlashcards() {
  // Build ordered index: shuffle within each group but keep group order
  fcState.order = [];
  flashcardData.forEach((g, gi) => { g.cards.forEach((_, ci) => fcState.order.push({ g: gi, c: ci })); });
  // Shuffle within groups
  const shuffled = [];
  flashcardData.forEach((g, gi) => {
    const indices = g.cards.map((_, ci) => ci);
    const shuffledIndices = shuffleArray(indices);
    shuffledIndices.forEach(ci => shuffled.push({ g: gi, c: ci }));
  });
  fcState.order = shuffled;
  fcState.groupIdx = 0;
  fcState.cardIdx = 0;
  fcState.flipped = false;
  renderCurrentFlashcard();
}

function renderFlashcards() {
  const container = document.getElementById('flashcardSection');
  if (!container) return;

  // Group tabs
  const tabs = flashcardData.map((g, i) =>
    `<button class="fc-group-tab ${i === 0 ? 'active' : ''}" data-group="${i}">${g.group}</button>`
  ).join('');

  container.innerHTML = `
    <div class="flashcard-toolbar">
      <h2>⚡ Flashcards de Fórmulas</h2>
    </div>
    <div class="fc-group-tabs" id="fcGroupTabs">${tabs}</div>
    <div class="fc-progress" id="fcProgress"></div>
    <div class="fc-container" id="fcContainer" onclick="flipCurrentCard()"></div>
    <div class="fc-nav" id="fcNav"></div>
    <div class="fc-actions" id="fcActions"></div>
  `;

  // Group tab click handlers
  container.querySelectorAll('.fc-group-tab').forEach(btn => {
    btn.addEventListener('click', () => {
      container.querySelectorAll('.fc-group-tab').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      fcState.groupIdx = parseInt(btn.dataset.group);
      fcState.cardIdx = 0;
      fcState.flipped = false;
      renderCurrentFlashcard();
    });
  });

  renderCurrentFlashcard();
}

function renderCurrentFlashcard() {
  const container = document.getElementById('fcContainer');
  const nav = document.getElementById('fcNav');
  const actions = document.getElementById('fcActions');
  const progress = document.getElementById('fcProgress');
  if (!container || !nav || !actions || !progress) return;

  // Find current card within the group
  const group = flashcardData[fcState.groupIdx];
  if (!group) return;

  // Find card by scanning the order for this group
  const groupOrder = fcState.order.filter(o => o.g === fcState.groupIdx);
  if (fcState.cardIdx >= groupOrder.length) fcState.cardIdx = 0;
  const currentOrder = groupOrder[fcState.cardIdx];
  if (!currentOrder) return;

  const card = group.cards[currentOrder.c];
  const mastered = isFcMastered(fcState.groupIdx, currentOrder.c);
  const masteredCount = fcGroupMasteredCount(fcState.groupIdx);
  const total = group.cards.length;
  const pct = Math.round(masteredCount / total * 100);

  // Progress
  progress.innerHTML = `<span>${group.group}</span>
    <div class="fc-progress-bar"><div class="fc-progress-fill" style="width:${pct}%"></div></div>
    <span>${masteredCount}/${total} aprendidas (${pct}%)</span>`;

  // Card
  container.innerHTML = `<div class="fc-card ${fcState.flipped ? 'flipped' : ''}">
    <div class="fc-face fc-front">
      <div class="fc-label">¿Cuál es la fórmula?</div>
      <div class="fc-topic">${group.group}</div>
      <div class="fc-name">${card.name}</div>
      <div class="fc-hint">💡 ${card.hint}</div>
    </div>
    <div class="fc-face fc-back">
      <div class="fc-formula">${card.formula}</div>
      <div class="fc-despejes"><strong>Despejes:</strong> ${card.despejes}</div>
      <div class="fc-when"><strong>💡 Pista:</strong> ${card.hint}</div>
    </div>
  </div>`;

  // Nav
  const isFirst = fcState.cardIdx === 0;
  const isLast = fcState.cardIdx >= groupOrder.length - 1;
  nav.innerHTML = `
    <button ${isFirst ? 'disabled' : ''} onclick="fcPrev()">◀ Anterior</button>
    <span class="fc-counter">${fcState.cardIdx + 1} / ${groupOrder.length}</span>
    <button ${isLast ? 'disabled' : ''} onclick="fcNext()">Siguiente ▶</button>
  `;

  // Actions
  const masteredBtnClass = mastered ? 'fc-btn-mastered is-mastered' : 'fc-btn-mastered';
  const masteredBtnText = mastered ? '✓ Aprendida' : '✓ Ya me la sé';
  actions.innerHTML = `
    <button class="${masteredBtnClass}" onclick="toggleFcMastered(event, ${fcState.groupIdx}, ${currentOrder.c})">${masteredBtnText}</button>
    <button class="fc-btn-shuffle" onclick="shuffleCurrentGroup()">🔀 Mezclar</button>
  `;
}

window.flipCurrentCard = function() {
  fcState.flipped = !fcState.flipped;
  const card = document.querySelector('.fc-card');
  if (card) card.classList.toggle('flipped');
};

window.fcPrev = function() {
  const groupOrder = fcState.order.filter(o => o.g === fcState.groupIdx);
  if (fcState.cardIdx > 0) {
    fcState.cardIdx--;
    fcState.flipped = false;
    renderCurrentFlashcard();
  }
};

window.fcNext = function() {
  const groupOrder = fcState.order.filter(o => o.g === fcState.groupIdx);
  if (fcState.cardIdx < groupOrder.length - 1) {
    fcState.cardIdx++;
    fcState.flipped = false;
    renderCurrentFlashcard();
  }
};

window.toggleFcMastered = function(event, groupIdx, cardIdx) {
  event.stopPropagation();
  const key = flashcardData[groupIdx].group + '-' + cardIdx;
  if (fcMastered[key]) {
    delete fcMastered[key];
  } else {
    fcMastered[key] = true;
  }
  localStorage.setItem(fcMasteredKey, JSON.stringify(fcMastered));
  renderCurrentFlashcard();
};

window.shuffleCurrentGroup = function() {
  // Re-shuffle only the current group's cards in the order array
  const groupOrder = fcState.order.filter(o => o.g === fcState.groupIdx);
  const otherOrder = fcState.order.filter(o => o.g !== fcState.groupIdx);
  const shuffled = shuffleArray(groupOrder);

  // Rebuild the full order: groups before stay, current group shuffled, groups after stay
  const before = fcState.order.slice(0, fcState.order.indexOf(groupOrder[0]));
  const afterStartIdx = fcState.order.lastIndexOf(groupOrder[groupOrder.length - 1]) + 1;
  const after = fcState.order.slice(afterStartIdx);
  fcState.order = [...before, ...shuffled, ...after];

  fcState.cardIdx = 0;
  fcState.flipped = false;
  renderCurrentFlashcard();
};


// ====== MNEMOTECNIAS ENGINE ======
function renderMnemos() {
  const container = document.getElementById('mnemoSection');
  if (!container) return;

  // Group tabs
  const tabs = mnemoData.map((g, i) =>
    `<button class="mnemo-group-tab ${i === 0 ? 'active' : ''}" data-group="${i}">${g.group}</button>`
  ).join('');

  container.innerHTML = `
    <div class="mnemo-toolbar">
      <h2>🧠 Mnemotecnias — Acuerdate de TODO</h2>
    </div>
    <div class="mnemo-group-tabs" id="mnemoGroupTabs">${tabs}</div>
    <div class="mnemo-grid" id="mnemoGrid"></div>
  `;

  // Group tab click handlers
  container.querySelectorAll('.mnemo-group-tab').forEach(btn => {
    btn.addEventListener('click', () => {
      container.querySelectorAll('.mnemo-group-tab').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      renderMnemoGroup(parseInt(btn.dataset.group));
    });
  });

  renderMnemoGroup(0);
}

function renderMnemoGroup(groupIdx) {
  const grid = document.getElementById('mnemoGrid');
  if (!grid) return;

  const group = mnemoData[groupIdx];
  if (!group) return;

  grid.innerHTML = group.cards.map((card, i) => `
    <div class="mnemo-card" id="mc-${groupIdx}-${i}" onclick="toggleMnemoCard(${groupIdx}, ${i})">
      <div class="mnemo-card-header">
        <span class="mnemo-emoji">${card.emoji}</span>
        <div class="mnemo-info">
          <div class="mnemo-name">${card.name}</div>
          <div class="mnemo-formula-mini">${card.formula}</div>
        </div>
        <span class="mnemo-toggle">▼</span>
      </div>
      <div class="mnemo-card-body">
        <div class="mnemo-text">
          <div style="font-size:1.05rem; margin-bottom:0.5rem; color:var(--warning); line-height:1.4;">${card.phrase}</div>
          <div style="font-size:0.85rem; opacity:0.8; border-top:1px solid rgba(255,255,255,0.1); padding-top:0.4rem; margin-top:0.4rem;">${card.decode}</div>
          <div style="font-size:0.8rem; margin-top:0.5rem; color:var(--text2);">${card.text}</div>
        </div>
      </div>
    </div>
  `).join('');
}

window.toggleMnemoCard = function(groupIdx, cardIdx) {
  const card = document.getElementById('mc-' + groupIdx + '-' + cardIdx);
  if (card) card.classList.toggle('open');
};

renderNav();
renderAll();
</script>

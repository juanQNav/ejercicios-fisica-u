<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Física Universitaria — Ejercicios Interactivos</title>
<style>
:root {
  --bg: #0f172a; --surface: #1e293b; --surface2: #334155;
  --text: #e2e8f0; --text2: #94a3b8; --accent: #38bdf8;
  --accent2: #818cf8; --success: #34d399; --warning: #fbbf24;
  --danger: #f87171; --radius: 12px;
}
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family: 'Segoe UI', system-ui, sans-serif; background: var(--bg); color: var(--text); line-height: 1.6; }
header { background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%); border-bottom: 1px solid var(--surface2); padding: 1.5rem 2rem; position: sticky; top: 0; z-index: 100; }
header h1 { font-size: 1.5rem; background: linear-gradient(90deg, var(--accent), var(--accent2)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
header p { color: var(--text2); font-size: 0.85rem; }
nav { display: flex; gap: 0.5rem; padding: 0.75rem 2rem; background: var(--surface); border-bottom: 1px solid var(--surface2); overflow-x: auto; flex-wrap: wrap; }
nav button { padding: 0.5rem 1rem; border: 1px solid var(--surface2); background: transparent; color: var(--text2); border-radius: 8px; cursor: pointer; font-size: 0.8rem; white-space: nowrap; transition: all 0.2s; }
nav button:hover { border-color: var(--accent); color: var(--accent); }
nav button.active { background: var(--accent); color: var(--bg); border-color: var(--accent); font-weight: 600; }
main { max-width: 900px; margin: 0 auto; padding: 1.5rem; }
.chapter-section { display: none; }
.chapter-section.active { display: block; }
.exercise-card { background: var(--surface); border: 1px solid var(--surface2); border-radius: var(--radius); margin-bottom: 1.5rem; overflow: hidden; }
.exercise-header { padding: 1rem 1.25rem; cursor: pointer; display: flex; justify-content: space-between; align-items: center; user-select: none; transition: background 0.2s; }
.exercise-header:hover { background: var(--surface2); }
.exercise-header h3 { font-size: 1rem; color: var(--accent); }
.exercise-header .toggle { font-size: 1.2rem; color: var(--text2); transition: transform 0.3s; }
.exercise-card.open .toggle { transform: rotate(180deg); }
.exercise-body { display: none; padding: 0 1.25rem 1.25rem; }
.exercise-card.open .exercise-body { display: block; }
.problem-statement { background: var(--surface2); border-left: 3px solid var(--accent2); padding: 1rem; border-radius: 0 8px 8px 0; margin-bottom: 1rem; font-size: 0.9rem; }
.diagram-container { background: #0f172a; border: 1px solid var(--surface2); border-radius: 8px; padding: 1rem; margin-bottom: 1rem; text-align: center; overflow-x: auto; }
.diagram-container svg { max-width: 100%; height: auto; }
.diagram-label { color: var(--text2); font-size: 0.75rem; margin-top: 0.5rem; }
.steps-container { margin: 1rem 0; }
.step { background: var(--bg); border: 1px solid var(--surface2); border-radius: 8px; margin-bottom: 0.5rem; overflow: hidden; }
.step-header { padding: 0.75rem 1rem; cursor: pointer; display: flex; justify-content: space-between; align-items: center; font-size: 0.85rem; color: var(--text2); }
.step-header:hover { color: var(--text); }
.step-header .step-num { background: var(--accent2); color: white; width: 24px; height: 24px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 0.7rem; font-weight: 700; margin-right: 0.5rem; flex-shrink: 0; }
.step-header .left { display: flex; align-items: center; }
.step-body { display: none; padding: 0.75rem 1rem; font-size: 0.85rem; border-top: 1px solid var(--surface2); }
.step.open .step-body { display: block; }
.math { font-family: 'Cambria Math', 'Latin Modern Math', Georgia, serif; color: var(--warning); background: rgba(251,191,36,0.08); padding: 0.15rem 0.4rem; border-radius: 4px; font-size: 0.9em; }
.formula-block { background: rgba(251,191,36,0.05); border: 1px solid rgba(251,191,36,0.15); border-radius: 8px; padding: 0.75rem 1rem; margin: 0.5rem 0; text-align: center; font-family: 'Cambria Math', Georgia, serif; color: var(--warning); font-size: 0.95rem; }
.tips-box { background: rgba(52,211,153,0.08); border: 1px solid rgba(52,211,153,0.2); border-radius: 8px; padding: 0.75rem 1rem; margin: 1rem 0; font-size: 0.8rem; }
.tips-box strong { color: var(--success); }
.answer-section { margin-top: 1rem; }
.btn { padding: 0.6rem 1.25rem; border: none; border-radius: 8px; cursor: pointer; font-size: 0.85rem; font-weight: 600; transition: all 0.2s; }
.btn-primary { background: var(--accent); color: var(--bg); }
.btn-primary:hover { background: #7dd3fc; }
.btn-success { background: var(--success); color: var(--bg); }
.btn-success:hover { background: #6ee7b7; }
.btn-outline { background: transparent; border: 1px solid var(--surface2); color: var(--text2); }
.btn-outline:hover { border-color: var(--accent); color: var(--accent); }
.answer-reveal { display: none; background: rgba(52,211,153,0.1); border: 1px solid rgba(52,211,153,0.3); border-radius: 8px; padding: 1rem; margin-top: 0.75rem; }
.answer-reveal.visible { display: block; }
.answer-reveal h4 { color: var(--success); margin-bottom: 0.5rem; }
.user-answer-section { margin-top: 0.75rem; }
.user-answer-section textarea { width: 100%; background: var(--bg); border: 1px solid var(--surface2); color: var(--text); border-radius: 8px; padding: 0.75rem; font-size: 0.85rem; resize: vertical; min-height: 60px; font-family: inherit; }
.user-answer-section textarea:focus { outline: none; border-color: var(--accent); }
.progress-bar { position: fixed; top: 0; left: 0; height: 3px; background: linear-gradient(90deg, var(--accent), var(--accent2)); z-index: 200; transition: width 0.3s; }
.stats { display: flex; gap: 1rem; padding: 0.75rem 2rem; background: var(--bg); border-bottom: 1px solid var(--surface2); font-size: 0.75rem; color: var(--text2); }
.stats span { display: flex; align-items: center; gap: 0.25rem; }
.stats .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
.stats .dot.solved { background: var(--success); }
.stats .dot.pending { background: var(--warning); }
/* ====== RESPONSIVE ====== */
@media (max-width: 768px) {
  header { padding: 0.75rem 1rem; }
  header h1 { font-size: 1.1rem; }
  header p { font-size: 0.75rem; }
  nav { padding: 0.5rem 0.75rem; gap: 0.35rem; }
  nav button { padding: 0.45rem 0.8rem; font-size: 0.75rem; min-height: 44px; }
  .stats { padding: 0.5rem 0.75rem; font-size: 0.7rem; flex-wrap: wrap; }
  main { padding: 0.75rem; }
  .exercise-header { padding: 0.75rem 1rem; }
  .exercise-header h3 { font-size: 0.85rem; }
  .exercise-body { padding: 0 0.75rem 1rem; }
  .problem-statement { padding: 0.75rem; font-size: 0.8rem; }
  .diagram-container { padding: 0.5rem; }
  .step-header { padding: 0.6rem 0.75rem; font-size: 0.8rem; min-height: 44px; }
  .step-body { padding: 0.6rem 0.75rem; font-size: 0.8rem; }
  .formula-block { padding: 0.5rem 0.75rem; font-size: 0.85rem; word-break: break-word; }
  .tips-box { padding: 0.6rem 0.75rem; font-size: 0.75rem; }
  .btn { padding: 0.65rem 1rem; font-size: 0.8rem; min-height: 44px; display: inline-flex; align-items: center; justify-content: center; }
  .answer-section { display: flex; flex-direction: column; gap: 0.5rem; }
  .user-answer-section textarea { font-size: 0.8rem; padding: 0.6rem; }
  .answer-reveal { padding: 0.75rem; }
  .answer-reveal pre { font-size: 0.8rem; }
}
@media (max-width: 420px) {
  header h1 { font-size: 1rem; }
  nav { padding: 0.4rem 0.5rem; }
  nav button { padding: 0.4rem 0.6rem; font-size: 0.7rem; }
  .exercise-header h3 { font-size: 0.8rem; }
  .problem-statement { font-size: 0.75rem; }
  .step-header { font-size: 0.75rem; }
  .step-body { font-size: 0.75rem; }
  .formula-block { font-size: 0.8rem; }
}
</style>
</head>
<body>
<div class="progress-bar" id="progressBar" style="width:0%"></div>
<header>
  <h1>Fisica Universitaria — Ejercicios Interactivos</h1>
  <p>Sears & Zemansky, 12a ed. — Resuelve paso a paso y practica</p>
</header>
<nav id="chapterNav"></nav>
<div class="stats" id="statsBar"></div>
<main id="mainContent"></main>

<script>
// ====== EXERCISE DATA ======
const exercises = {
"Capitulo 1": [
{
  id: "1.32",
  title: "Ejercicio 1.32 — Suma y resta de vectores",
  problem: "Con los vectores A y B de la figura 1.34, use un dibujo a escala para obtener la magnitud y la dirección de: a) la resultante A + B; b) la diferencia A - B. Con base en sus respuestas, determine la magnitud y la dirección de: c) -A - B; d) B - A. Datos: Vector A = 8.00 m dirigido hacia abajo (-y). Vector B = 15.0 m a 30.0° a la derecha del eje +y.",
  tips: "¡Ojo! El vector A apunta hacia ABAJO (-y), no hacia +x. El vector B está a 30° desde el +y, lo que equivale a 60° desde el +x. Las componentes son: Bx = B·sin(30°), By = B·cos(30°).",
  steps: [
    {title: "Identificar datos y ángulos correctos", body: "Vector A: 8.00 m hacia -y (ángulo 270° desde +x).\nVector B: 15.0 m, 30° a la derecha del +y → ángulo = 90° - 30° = 60° desde +x."},
    {title: "Calcular componentes de A", body: "Ax = 8.00 · cos(270°) = 0.00 m\nAy = 8.00 · sin(270°) = -8.00 m", formula: "A = (0.00 m)i - (8.00 m)j"},
    {title: "Calcular componentes de B", body: "Bx = 15.0 · cos(60°) = 15.0 × 0.5000 = 7.50 m\nBy = 15.0 · sin(60°) = 15.0 × 0.8660 = 12.99 m", formula: "B = (7.50 m)i + (12.99 m)j"},
    {title: "a) Resultante A + B — componentes", body: "Rx = Ax + Bx = 0 + 7.50 = 7.50 m\nRy = Ay + By = -8.00 + 12.99 = 4.99 m"},
    {title: "a) Magnitud y dirección de A + B", body: "R = √(7.50² + 4.99²) = (56.25 + 24.90) = √81.15 ≈ 9.01 m\nθ = arctan(4.99/7.50) = arctan(0.6653) ≈ 33.6°", formula: "A + B = 9.01 m a 33.6° sobre el eje +x"},
    {title: "b) Diferencia A - B — componentes", body: "Dx = Ax - Bx = 0 - 7.50 = -7.50 m\nDy = Ay - By = -8.00 - 12.99 = -20.99 m\nAmbas negativas → tercer cuadrante."},
    {title: "b) Magnitud y dirección de A - B", body: "D = √((-7.50)² + (-20.99)²) = √(56.25 + 440.58) = √496.83 ≈ 22.3 m\nθ = 180° + arctan(20.99/7.50) = 180° + 70.3° = 250.3°", formula: "A - B = 22.3 m a 250.3° (70.3° al sur del oeste)"},
    {title: "c) -A - B (opuesto de A + B)", body: "El vector -A - B es el negativo de (A + B).\nMagnitud: misma = 9.01 m\nDirección: 33.6° + 180° = 213.6°", formula: "-A - B = 9.01 m a 213.6°"},
    {title: "d) B - A (opuesto de A - B)", body: "El vector B - A es el negativo de (A - B).\nMagnitud: misma = 22.3 m\nDirección: 250.3° - 180° = 70.3°", formula: "B - A = 22.3 m a 70.3° sobre +x"}
  ],
  answer: "a) 9.01 m a 33.6° sobre +x\nb) 22.3 m a 250.3° (70.3° al sur del oeste)\nc) 9.01 m a 213.6° (33.6° al sur del oeste)\nd) 22.3 m a 70.3° sobre +x",
  diagram: "vectors"
},
{
  id: "1.47",
  title: "Ejercicio 1.47 — Vectores en notacion unitaria",
  problem: "Escriba cada uno de los vectores de la figura 1.34 en términos de los vectores unitarios i y j. Datos: A = 8.00 m hacia abajo (-y); B = 15.0 m a 30° a la derecha del +y; C = 12.0 m a 25° debajo del -x (3er cuadrante); D = 10.0 m a 53° a la izquierda del +y (2do cuadrante).",
  tips: "¡Cuidado con los ángulos! A va hacia -y (270°). B está a 60° desde +x. C está a 180°+25°=205° desde +x. D está a 90°+53°=143° desde +x. El coseno da la componente x, el seno la y.",
  steps: [
    {title: "Vector A (8.00 m, 270°)", body: "Ax = 8.00 · cos(270°) = 0.00 m\nAy = 8.00 · sin(270°) = -8.00 m", formula: "A = -(8.00 m)j"},
    {title: "Vector B (15.0 m, 60°)", body: "Bx = 15.0 · cos(60°) = 15.0 × 0.5000 = 7.50 m\nBy = 15.0 · sin(60°) = 15.0 × 0.8660 = 12.99 m", formula: "B = (7.50 m)i + (13.0 m)j"},
    {title: "Vector C (12.0 m, 205°)", body: "Cx = 12.0 · cos(205°) = 12.0 × (-0.9063) = -10.88 m\nCy = 12.0 · sin(205°) = 12.0 × (-0.4226) = -5.07 m", formula: "C = (-10.9 m)i - (5.07 m)j"},
    {title: "Vector D (10.0 m, 143°)", body: "Dx = 10.0 · cos(143°) = 10.0 × (-0.7986) = -7.99 m\nDy = 10.0 · sin(143°) = 10.0 × (0.6018) = 6.02 m", formula: "D = (-8.00 m)i + (6.02 m)j"}
  ],
  answer: "A = -(8.00 m)j\nB = (7.50 m)i + (13.0 m)j\nC = (-10.9 m)i - (5.07 m)j\nD = (-8.00 m)i + (6.02 m)j",
  diagram: "vectors4"
}
],
"Capitulo 2": [
{
  id: "2.1",
  title: "Ejercicio 2.1 — Velocidad media de un cohete",
  problem: "Un cohete que lleva un satélite acelera verticalmente alejándose de la superficie terrestre. 1.15 s después del despegue, el cohete libra el tope de su plataforma de lanzamiento, a 63 m sobre el suelo; y después de otros 4.75 s, está a 1.00 km sobre el suelo. Calcule la magnitud de la velocidad media del cohete en: a) la parte de 4.75 s de su vuelo; b) los primeros 5.90 s de su vuelo.",
  tips: "La velocidad media es SIEMPRE desplazamiento / intervalo de tiempo. No la confundas con la rapidez media (distancia total / tiempo). Aqui todo es en linea recta vertical, asi que desplazamiento = cambio en y.",
  steps: [
    {title: "Identificar datos", body: "t0 = 0 s → y0 = 0 m\nt1 = 1.15 s → y1 = 63 m\nt2 = 1.15 + 4.75 = 5.90 s → y2 = 1000 m"},
    {title: "a) Velocidad media en el intervalo de 4.75 s", body: "Δy = y2 - y1 = 1000 - 63 = 937 m\nΔt = 4.75 s", formula: "v_med = Δy/Δt = 937/4.75 = 197 m/s"},
    {title: "b) Velocidad media en los primeros 5.90 s", body: "Δy = y2 - y0 = 1000 - 0 = 1000 m\nΔt = 5.90 s", formula: "v_med = 1000/5.90 = 169 m/s"}
  ],
  answer: "a) 197 m/s\nb) 169 m/s",
  diagram: "rocket"
},
{
  id: "2.4",
  title: "Ejercicio 2.4 — Rapidez media vs velocidad media",
  problem: "De pilar a poste. Partiendo de un pilar, usted corre 200 m al este (direccion +x) con rapidez media de 5.0 m/s, luego 280 m al oeste con rapidez media de 4.0 m/s hasta un poste. Calcule: a) su rapidez media del pilar al poste; b) su velocidad media del pilar al poste.",
  tips: "Rapidez media = distancia TOTAL / tiempo TOTAL (siempre positiva). Velocidad media = desplazamiento NETO / tiempo TOTAL (puede ser negativa). Esta diferencia es CLAVE en fisica.",
  steps: [
    {title: "Calcular tiempos de cada tramo", body: "Tramo 1 (este): t1 = 200 m / 5.0 m/s = 40.0 s\nTramo 2 (oeste): t2 = 280 m / 4.0 m/s = 70.0 s\nt_total = 40.0 + 70.0 = 110.0 s"},
    {title: "a) Rapidez media", body: "Distancia total = 200 + 280 = 480 m", formula: "Rapidez media = 480/110.0 = 4.36 m/s"},
    {title: "b) Velocidad media", body: "Desplazamiento neto = +200 - 280 = -80 m (80 m al oeste)", formula: "v_med = -80/110.0 = -0.727 m/s (0.727 m/s hacia el oeste)"}
  ],
  answer: "a) 4.36 m/s\nb) -0.727 m/s (0.727 m/s hacia el oeste)",
  diagram: "runner"
},
{
  id: "2.10",
  title: "Ejercicio 2.10 — Interpretar grafica x-t",
  problem: "Una profesora de fisica sale de su casa y camina por la acera hacia el campus. A los 5 min, comienza a llover y ella regresa a casa. Su distancia con respecto a su casa en funcion del tiempo se muestra en la figura 2.32. ¿En cual punto rotulado su velocidad es: a) cero, b) constante y positiva, c) constante y negativa, d) de magnitud creciente, e) de magnitud decreciente?",
  tips: "En una grafica posicion vs tiempo (x-t), la velocidad instantanea es la PENDIENTE de la recta tangente en cada punto. Pendiente horizontal = velocidad cero. Pendiente constante = velocidad constante. Curva que se inclina mas = aceleracion.",
  steps: [
    {title: "a) Velocidad cero", body: "Ocurre donde la pendiente es horizontal (tangente plana). En la grafica, esto es el punto mas alto de la curva, donde la profesora se detiene antes de regresar.", formula: "Punto IV"},
    {title: "b) Velocidad constante y positiva", body: "Seccion recta con pendiente positiva (linea subiendo uniformemente).", formula: "Punto I"},
    {title: "c) Velocidad constante y negativa", body: "Seccion recta con pendiente negativa (linea bajando uniformemente, regresando a casa).", formula: "Punto V"},
    {title: "d) Magnitud creciente", body: "La curva se inclina cada vez mas hacia arriba (concava hacia arriba): la velocidad aumenta.", formula: "Punto II"},
    {title: "e) Magnitud decreciente", body: "La pendiente decrece hacia cero al aproximarse al punto mas alto: se va frenando.", formula: "Punto III"}
  ],
  answer: "a) Punto IV (velocidad cero)\nb) Punto I (constante positiva)\nc) Punto V (constante negativa)\nd) Punto II (magnitud creciente)\ne) Punto III (magnitud decreciente)",
  diagram: "xt_graph"
},
{
  id: "2.11",
  title: "Ejercicio 2.11 — Rapidez y velocidad desde grafica v-t",
  problem: "Una pelota se mueve en linea recta (eje x). En la figura 2.33 la grafica muestra la velocidad de esta pelota en funcion del tiempo. a) ¿Cuales son la rapidez media y la velocidad media durante los primeros 3.0 s? b) Si el segmento despues de 2.0 s fuera -3.0 m/s en vez de +3.0 m/s, calcule la rapidez media y la velocidad media.",
  tips: "En grafica v-t: el desplazamiento es el AREA bajo la curva (con signo). La distancia total es la suma de las areas en valor absoluto. De 0 a 2 s: v = +2.0 m/s. De 2 a 3 s: v = +3.0 m/s.",
  steps: [
    {title: "a) Caso original (v siempre positiva)", body: "Tramo 1 (0-2 s): Δx1 = 2.0 × 2.0 = 4.0 m\nTramo 2 (2-3 s): Δx2 = 3.0 × 1.0 = 3.0 m\nDesplazamiento total = 4.0 + 3.0 = 7.0 m\nDistancia total = 7.0 m"},
    {title: "a) Resultados", formula: "v_med = 7.0/3.0 = 2.33 m/s\nRapidez media = 7.0/3.0 = 2.33 m/s"},
    {title: "b) Caso con v = -3.0 m/s en segundo tramo", body: "Tramo 1: Δx1 = 4.0 m\nTramo 2: Δx2 = (-3.0)(1.0) = -3.0 m\nDesplazamiento = 4.0 + (-3.0) = 1.0 m\nDistancia total = |4.0| + |-3.0| = 7.0 m"},
    {title: "b) Resultados", formula: "v_med = 1.0/3.0 = 0.333 m/s\nRapidez media = 7.0/3.0 = 2.33 m/s"}
  ],
  answer: "a) v_med = 2.33 m/s, rapidez media = 2.33 m/s\nb) v_med = 0.333 m/s, rapidez media = 2.33 m/s",
  diagram: "vt_graph"
},
{
  id: "2.12",
  title: "Ejercicio 2.12 — Aceleracion media e instantanea",
  problem: "Un piloto de pruebas obtiene las siguientes lecturas de rapidez durante una prueba en linea recta:\nTiempo(s): 0, 2, 4, 6, 8, 10, 12, 14, 16\nRapidez(m/s): 0, 0, 2, 6, 10, 16, 19, 22, 22\na) Calcule la aceleracion media en cada intervalo de 2 s. ¿La aceleracion es constante? ¿En alguna parte de la prueba?\nb) Mida la pendiente de la curva v-t para obtener la aceleracion instantanea en t = 9 s, 13 s y 15 s.",
  tips: "Aceleracion media = Δv/Δt. Para ver si es constante, compara los valores de cada intervalo. La aceleracion instantanea es la pendiente de la tangente a la curva v-t en un punto dado.",
  steps: [
    {title: "a) Aceleracion media por intervalo", body: "0-2 s: (0-0)/2 = 0.0 m/s²\n2-4 s: (2-0)/2 = 1.0 m/s²\n4-6 s: (6-2)/2 = 2.0 m/s²\n6-8 s: (10-6)/2 = 2.0 m/s²\n8-10 s: (16-10)/2 = 3.0 m/s²\n10-12 s: (19-16)/2 = 1.5 m/s²\n12-14 s: (22-19)/2 = 1.5 m/s²\n14-16 s: (22-22)/2 = 0.0 m/s²"},
    {title: "Analisis de constancia", body: "No es constante durante toda la prueba.\nSi es constante en tramos: 0-2 s (0), 4-8 s (2.0), 10-14 s (1.5), 14-16 s (0)."},
    {title: "b) Aceleracion instantanea", body: "Se mide la pendiente de la tangente a la curva suave v-t:\nt = 9 s → ≈ 2.8 m/s² (cerca de 3.0)\nt = 13 s → ≈ 1.5 m/s²\nt = 15 s → 0.0 m/s²"}
  ],
  answer: "a) 0, 1.0, 2.0, 2.0, 3.0, 1.5, 1.5, 0.0 m/s² (no es constante)\nb) t=9s: ≈2.8 m/s², t=13s: ≈1.5 m/s², t=15s: 0.0 m/s²",
  diagram: "table_graph"
},
{
  id: "2.13",

const diagramMap = {
  vectors: svgVectors, vectors4: svgVectors4, rocket: svgRocket, runner: svgRunner,
  xt_graph: svgXTGraph, vt_graph: svgVTGraph, three_phase: svgThreePhase,
  balloon: svgBalloon, cliff: svgCliff, cliff_jump: svgCliffJump, marble_cavity: svgMarbleCavity,
  coin_toss: svgCoinToss, ferris_wheel: svgFerrisWheel, ferris_wheel_accel: svgFerrisWheelAccel,
  baseball: svgBaseball, car_crash: svgCarCrash, ramp: svgRamp, accel_graph: svgAccelGraph,
  moon_landing: svgMoonLanding, flea: svgFlea, road_trip: svgRoadTrip, table_graph: svgTableGraph, bugatti: svgBugatti
};

// ====== STATE ======
const solvedKey = 'fisica_univ_solved';
let solved = JSON.parse(localStorage.getItem(solvedKey) || '[]');

function markSolved(id) {
  if (!solved.includes(id)) { solved.push(id); localStorage.setItem(solvedKey, JSON.stringify(solved)); }
}

// ====== RENDER ======
function renderNav() {
  const nav = document.getElementById('chapterNav');
  const chapters = Object.keys(exercises);
  nav.innerHTML = chapters.map((ch, i) => `<button class="${i===0?'active':''}" data-chapter="${ch}">${ch}</button>`).join('');
  nav.querySelectorAll('button').forEach(btn => {
    btn.addEventListener('click', () => {
      nav.querySelectorAll('button').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      document.querySelectorAll('.chapter-section').forEach(s => s.classList.remove('active'));
      document.getElementById('ch-' + btn.dataset.chapter.replace(/ /g,'_')).classList.add('active');
      updateProgress();
    });
  });
}

function renderStats() {
  const total = Object.values(exercises).flat().length;
  const done = solved.length;
  document.getElementById('statsBar').innerHTML = `<span><span class="dot solved"></span> Resueltos: ${done}/${total}</span><span><span class="dot pending"></span> Pendientes: ${total - done}</span><span>Progreso: ${Math.round(done/total*100)}%</span>`;
}

function updateProgress() {
  const total = Object.values(exercises).flat().length;
  document.getElementById('progressBar').style.width = (solved.length / total * 100) + '%';
  renderStats();
}

function renderExercise(ex, idx) {
  const isSolved = solved.includes(ex.id);
  const diagFn = diagramMap[ex.diagram] || defaultDiagram;
  return `<div class="exercise-card ${isSolved ? 'solved' : ''}" id="ex-${ex.id.replace('.','_')}">
    <div class="exercise-header" onclick="this.parentElement.classList.toggle('open')">
      <h3>${ex.id} — ${ex.title.replace(/^Ejercicio \d+\.\d+ — /, '')}</h3>
      <span class="toggle">${isSolved ? '✓' : '▼'}</span>
    </div>
    <div class="exercise-body">
      <div class="problem-statement"><strong>Problema:</strong><br>${ex.problem.replace(/\n/g, '<br>')}</div>
      <div class="diagram-container">
        ${diagFn()}
        <div class="diagram-label">Figura de referencia — ${ex.id}</div>
      </div>
      <div class="tips-box"><strong>💡 Consejo:</strong> ${ex.tips}</div>
      <div class="steps-container">
        <h4 style="margin-bottom:0.5rem; color: var(--accent2); font-size:0.9rem;">Resolucion paso a paso:</h4>
        ${ex.steps.map((s, i) => `<div class="step" onclick="this.classList.toggle('open')">
          <div class="step-header"><span class="left"><span class="step-num">${i+1}</span>${s.title}</span><span class="toggle">▼</span></div>
          <div class="step-body">${s.body ? s.body.replace(/\n/g, '<br>') : ''}${s.formula ? `<div class="formula-block">${s.formula}</div>` : ''}</div>
        </div>`).join('')}
      </div>
      <div class="answer-section">
        <button class="btn btn-primary" onclick="toggleAnswer('${ex.id.replace('.','_')}', this)">🔍 Verificar mi respuesta</button>
        <div class="user-answer-section" id="ua-${ex.id.replace('.','_')}" style="display:none">
          <textarea placeholder="Escribe tu respuesta aqui antes de ver la solucion..."></textarea>
          <div style="margin-top:0.5rem; display:flex; gap:0.5rem;">
            <button class="btn btn-success" onclick="revealAnswer('${ex.id.replace('.','_')}', this)">Mostrar respuesta correcta</button>
          </div>
        </div>
        <div class="answer-reveal" id="ans-${ex.id.replace('.','_')}">
          <h4>Respuesta correcta:</h4>
          <pre style="white-space:pre-wrap; color: var(--text); font-size:0.85rem;">${ex.answer}</pre>
          <div style="margin-top:0.5rem; display:flex; gap:0.5rem; flex-wrap:wrap;">
            <button class="btn btn-success" onclick="markSolvedAndClose('${ex.id}', this)">✓ Lo resolvi correcto</button>
            <button class="btn btn-outline" onclick="this.closest('.answer-reveal').classList.remove('visible')">Ocultar</button>
          </div>
        </div>
      </div>
    </div>
  </div>`;
}

function renderAll() {
  const main = document.getElementById('mainContent');
  const chapters = Object.keys(exercises);
  main.innerHTML = chapters.map(ch => `<div class="chapter-section ${ch===chapters[0]?'active':''}" id="ch-${ch.replace(/ /g,'_')}">
    ${exercises[ch].map((ex, i) => renderExercise(ex, i)).join('')}
  </div>`).join('');
  updateProgress();
}

// ====== INTERACTIONS ======
window.toggleAnswer = function(id, btn) {
  const ua = document.getElementById('ua-' + id);
  if (ua.style.display === 'none') {
    ua.style.display = 'block';
    btn.textContent = '✏️ Escribi tu respuesta...';
  }
};

window.revealAnswer = function(id, btn) {
  const ans = document.getElementById('ans-' + id);
  ans.classList.add('visible');
  btn.closest('.answer-section').querySelector('.btn-primary').style.display = 'none';
};

window.markSolvedAndClose = function(id, btn) {
  markSolved(id);
  const card = document.getElementById('ex-' + id);
  if (card) card.querySelector('.toggle').textContent = '✓';
  updateProgress();
  btn.textContent = '✓ Marcado como resuelto';
  btn.disabled = true;
};

// ====== INIT ======
renderNav();
renderAll();
</script>
